name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ORIGIN: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_key
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_service_role_ci_test_key
      RATE_LIMIT_DIGEST_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PUBLIC_OWNER_NAME: "Tech Event Discover Beta"
      PUBLIC_CONTACT_EMAIL: contact@example.org
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      AUTH_SIGNUP_ENABLED: "false"
      RESEND_API_KEY: re_ci_test_placeholder_key
      REMINDER_FROM_EMAIL: reminders@example.org
      RESEND_WEBHOOK_SECRET: whsec_MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      RECIPIENT_DIGEST_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      REMINDER_CONSENT_NOTICE_VERSION: 2026-11-r2-v1
      REMINDER_SEND_ENABLED: "false"
      REMINDER_DELIVERY_MODE: smoke
      REMINDER_SMOKE_ALLOWLIST: ""
      JOB_ALERT_RECIPIENT: alerts@example.org
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      MAILPIT_URL: http://127.0.0.1:54324

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.19.7

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest unit and domain tests
        run: npm test

      - name: Start local Supabase and execute pgTAP tests
        run: |
          supabase start
          supabase db reset
          supabase test db

      - name: Build Next.js production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e
